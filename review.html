<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inspection Review</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, "Segoe UI", Arial, sans-serif; background: #f0f2f5; color: #1a2a3a; font-size: 15px; }
.top { position: sticky; top: 0; z-index: 20; background: #003B6E; color: #fff; padding: 10px 14px; }
.top h1 { font-size: 17px; margin: 0; }
.top .sub { font-size: 12px; opacity: .8; margin-top: 2px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.bar select, .bar button { font-size: 14px; padding: 7px 10px; border-radius: 6px; border: 0; }
.bar select { background: #fff; color: #1a2a3a; max-width: 100%; }
.bar button { background: #e8f4fd; color: #003B6E; font-weight: bold; cursor: pointer; }
.bar .stats { font-size: 12px; margin-left: auto; }
.wrap { max-width: 980px; margin: 0 auto; padding: 14px; }
.card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.1); padding: 14px; margin-bottom: 12px; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.meta label { font-size: 12px; font-weight: bold; color: #555; display: block; margin-bottom: 3px; }
input[type=text], input[type=date], textarea { width: 100%; font-size: 15px; padding: 8px; border: 1px solid #ccd3db; border-radius: 6px; font-family: inherit; color: #1a2a3a; background: #fff; }
textarea { min-height: 70px; resize: vertical; }
.sec-title { background: #003B6E; color: #fff; font-weight: bold; padding: 8px 12px; border-radius: 8px; margin: 18px 0 8px; }
.q { background: #fff; border-radius: 8px; padding: 12px; margin-bottom: 8px; border-left: 4px solid #ccd3db; }
.q.pre { border-left-color: #8a6d3b; }
.q.ans-YES { border-left-color: #2e7d4f; }
.q.ans-NO { border-left-color: #b03a2e; }
.q.ans-NA { border-left-color: #888; }
.qh { display: flex; gap: 8px; }
.qn { background: #003B6E; color: #fff; font-weight: bold; font-size: 12px; padding: 2px 7px; border-radius: 5px; height: fit-content; white-space: nowrap; }
.qt { font-weight: bold; }
.ans { display: flex; gap: 8px; margin: 10px 0 8px; }
.ans label { flex: 1; text-align: center; padding: 7px 4px; border: 1.5px solid #ccd3db; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; user-select: none; }
.ans input { display: none; }
.ans label.on-YES { background: #e3f3ea; border-color: #2e7d4f; color: #2e7d4f; }
.ans label.on-NO { background: #f8e6e3; border-color: #b03a2e; color: #b03a2e; }
.ans label.on-NA { background: #eee; border-color: #888; color: #555; }
.note { background: #f6f3ec; border: 1px dashed #b9a57a; border-radius: 6px; padding: 7px 9px; font-size: 13px; color: #5a4a2a; margin-bottom: 8px; }
.note b { color: #6b4a1f; }
.remark { font-size: 13px; color: #8a2b1f; margin-bottom: 8px; }
.obsrow { font-size: 13px; margin: 6px 0; }
.syn { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: 8px; }
.syn label { font-size: 11px; font-weight: bold; color: #666; display: block; margin-bottom: 2px; }
.syn input { font-size: 13px; padding: 6px; }
.photos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.ph { position: relative; width: 120px; height: 120px; border-radius: 6px; overflow: hidden; background: #e6eaee; }
.ph img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
.ph button { position: absolute; top: 3px; right: 3px; width: 24px; height: 24px; border-radius: 12px; border: 0; background: rgba(0,0,0,.6); color: #fff; cursor: pointer; }
.addph { display: inline-block; margin-top: 8px; font-size: 13px; color: #003B6E; border: 1px solid #003B6E; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.addph input { display: none; }
.un { border: 1.5px solid #b9a57a; }
.un h2 { font-size: 15px; margin: 0 0 8px; color: #6b4a1f; }
.unitem { border-top: 1px solid #e3dccb; padding: 8px 0; }
.assign { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.assign input { width: 90px; font-size: 13px; padding: 5px; }
.assign button, .smallbtn { font-size: 13px; padding: 5px 10px; border-radius: 6px; border: 1px solid #003B6E; background: #fff; color: #003B6E; cursor: pointer; }
.hidden { display: none !important; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 20px; background: #1a2a3a; color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 14px; z-index: 50; }
.viewer { position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 40; display: flex; align-items: center; justify-content: center; }
.viewer img { max-width: 96%; max-height: 96%; }
#printView { display: none; }
@media (max-width: 700px) { .top { position: static; } .syn { grid-template-columns: 1fr; } .bar .stats { margin-left: 0; width: 100%; } }

@media print {
  @page { size: A4; margin: 12mm; }
  body { background: #fff; font-size: 10pt; }
  #app, .toast, .viewer { display: none !important; }
  #printView { display: block; }
  .pv-title { font-size: 14pt; font-weight: bold; color: #003B6E; margin-bottom: 8px; }
  .pv-block { border: 1px solid #ccd3db; border-radius: 6px; padding: 8px; margin-bottom: 8px; page-break-inside: avoid; }
  .pv-block h3 { font-size: 10.5pt; margin: 0 0 6px; color: #003B6E; }
  .pv-table td { padding: 2px 8px 2px 0; font-size: 9.5pt; vertical-align: top; }
  .pv-stats { display: flex; gap: 8px; margin-bottom: 8px; }
  .pv-stat { flex: 1; text-align: center; border: 1px solid #ccd3db; border-radius: 6px; padding: 4px; }
  .pv-stat b { display: block; font-size: 15pt; }
  .pv-chip { display: inline-block; border: 1px solid #b03a2e; color: #b03a2e; border-radius: 10px; padding: 1px 7px; margin: 2px; font-size: 9pt; }
  .pv-sec { background: #003B6E !important; color: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; padding: 4px 8px; font-weight: bold; margin: 10px 0 4px; page-break-after: avoid; }
  .pv-q { border-bottom: 1px solid #e3e6ea; padding: 4px 0; page-break-inside: avoid; }
  .pv-q.f { border-left: 3px solid #b03a2e; padding-left: 6px; }
  .pv-qh { display: flex; gap: 8px; }
  .pv-qh .n { font-weight: bold; min-width: 42px; }
  .pv-qh .t { flex: 1; }
  .pv-qh .a { font-weight: bold; min-width: 40px; text-align: right; }
  .pv-c { margin: 3px 0 0 50px; font-style: italic; white-space: pre-wrap; }
  .pv-ph { margin: 4px 0 0 50px; }
  .pv-ph img { width: 150px; height: 112px; object-fit: cover; margin: 0 6px 6px 0; border: 1px solid #ccc; }
}
.fl{margin:8px 0 4px;font-size:12px;font-weight:bold;color:#003B6E}
.fx{margin-top:10px;padding-top:6px;border-top:1px dashed #ccd3db}
.linked{margin:6px 0;padding:6px 9px;border-radius:6px;background:#e8f0fb;color:#00396b;font-size:12.5px}
</style>
</head>
<body>
<div id="loader" class="hidden">
  <div class="top"><h1>Inspection Review</h1><div class="sub">Open a report file (.html) received from your assistant</div></div>
  <div class="wrap">
    <div class="card">
      <label class="addph" style="font-size:15px;padding:10px 14px">Open report file<input type="file" id="inReport"></label>
      <div style="font-size:12px;color:#777;margin-top:8px">On iPhone: save the file in Files first. The file is read on this device only; nothing is sent to any server.</div>
    </div>
    <div id="repList"></div>
  </div>
</div>
<div id="app" class="hidden">
  <div class="top">
    <h1 id="hTitle">Inspection Review</h1>
    <div class="sub" id="hSub"></div>
    <div class="bar">
      <select id="selTpl"></select>
      <select id="selFilter">
        <option value="all">All questions</option>
        <option value="pre">Pre-filled / commented</option>
        <option value="no">NO answers</option>
        <option value="open">Not answered</option>
      </select>
      <button id="btnPdf" type="button">Export PDF</button>
      <button id="btnXls" type="button">Export Excel (Synergi)</button>
      <button id="btnReports" type="button" class="hidden">Reports</button>
      <span class="stats" id="stats"></span>
    </div>
  </div>
  <div class="wrap">
    <div class="card">
      <div class="meta">
        <div><label for="mVessel">Vessel</label><input type="text" id="mVessel"></div>
        <div><label for="mDate">Inspection date</label><input type="date" id="mDate"></div>
        <div><label for="mInspector">Inspector</label><input type="text" id="mInspector"></div>
        <div><label for="mLocation">Location</label><input type="text" id="mLocation"></div>
        <div><label for="mTag">Synergi comment tag</label><input type="text" id="mTag"></div>
      </div>
    </div>
    <div id="unBox"></div>
    <div id="qList"></div>
    <div class="card" style="font-size:12px;color:#777">
      Answers and edits are saved automatically in this browser.
      <button class="smallbtn" id="btnReset" type="button" style="margin-left:8px">Revert to original draft</button>
    </div>
  </div>
</div>
<div id="printView"></div>
<div id="viewer" class="viewer hidden"><img id="viewerImg" alt=""></div>
<div id="toast" class="toast hidden"></div>

<script id="review-data" type="application/json">__REVIEW_DATA__</script>

var NOT_ASSESSED = "This item was not assessed within the scope of this inspection; no evidence was reviewed and no conclusion is drawn.";
var D = null;
var SKEY = '';

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function trim(s) { return String(s == null ? '' : s).replace(/^\s+|\s+$/g, ''); }

/* ---------- state ---------- */
function freshState() {
  var s = { meta: { vessel: D.meta.vessel || '', date: D.meta.date || '', inspector: D.meta.inspector || '', location: D.meta.location || '', tag: D.meta.tag || 'TEPA DP NAV-DP1' }, t: [], moved: {} };
  for (var i = 0; i < D.templates.length; i++) {
    var T = D.templates[i], ts = { ans: {}, cmt: {}, obs: {}, subj: {}, act: {}, removed: {} };
    for (var s0 = 0; s0 < T.sections.length; s0++) { for (var k0 = 0; k0 < T.sections[s0].questions.length; k0++) { var q0 = T.sections[s0].questions[k0].q; ts.ans[q0] = 'NA'; if (!T.items[q0]) { ts.cmt[q0] = NOT_ASSESSED; } } }
    for (var q in T.items) {
      var it = T.items[q];
      ts.cmt[q] = it.comment || '';
      ts.obs[q] = true;
      ts.subj[q] = it.subject || '';
      ts.act[q] = it.action || '';
      for (var x0 = 0; x0 < (it.extra || []).length; x0++) { var k0 = q + '#' + it.extra[x0].obs; ts.cmt[k0] = it.extra[x0].comment || ''; ts.subj[k0] = it.extra[x0].subject || ''; ts.act[k0] = it.extra[x0].action || ''; }
    }
    s.t.push(ts);
  }
  return s;
}
function loadState() {
  try { ST = JSON.parse(localStorage.getItem(SKEY)); } catch (e) { ST = null; }
  if (!ST || !ST.t || ST.t.length !== D.templates.length) { ST = freshState(); }
}
var saveT = null;
function save() {
  if (saveT) { clearTimeout(saveT); }
  saveT = setTimeout(function () {
    try { localStorage.setItem(SKEY, JSON.stringify(ST)); } catch (e) { toast('Browser storage full: export now'); }
  }, 400);
}

/* ---------- IndexedDB for added photos ---------- */
var idb = null;
function dbOpen(cb) {
  if (idb) { cb(idb); return; }
  if (!window.indexedDB) { cb(null); return; }
  var r;
  try { r = indexedDB.open('tepa-review', 2); } catch (e) { cb(null); return; }
  r.onupgradeneeded = function (e) {
    var d = e.target.result;
    if (!d.objectStoreNames.contains('photos')) { d.createObjectStore('photos'); }
    if (!d.objectStoreNames.contains('reports')) { d.createObjectStore('reports'); }
  };
  r.onsuccess = function (e) { idb = e.target.result; cb(idb); };
  r.onerror = function () { cb(null); };
}
function loadAdded(cb) {
  dbOpen(function (db) {
    if (!db) { cb(); return; }
    var g = db.transaction('photos', 'readonly').objectStore('photos').get(SKEY);
    g.onsuccess = function () { ADDED = g.result || {}; cb(); };
    g.onerror = function () { cb(); };
  });
}
function saveAdded() {
  dbOpen(function (db) {
    if (!db) { toast('Photo storage not available'); return; }
    var tx = db.transaction('photos', 'readwrite');
    tx.objectStore('photos').put(ADDED, SKEY);
    tx.onerror = function () { toast('Photo could not be saved'); };
  });
}
function compress(file, cb) {
  var u = URL.createObjectURL(file), img = new Image();
  img.onload = function () {
    var r = Math.min(1, 1200 / Math.max(img.naturalWidth, img.naturalHeight));
    var c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(u);
    cb(c.toDataURL('image/jpeg', 0.6));
  };
  img.onerror = function () { URL.revokeObjectURL(u); cb(null); };
  img.src = u;
}

/* ---------- photos per question ---------- */
function basePhotos(ti, q) {
  var it = D.templates[ti].items[q];
  var list = it && it.photos ? it.photos.slice(0) : [];
  var mv = ST.moved[ti + '|' + q] || [];
  for (var i = 0; i < mv.length; i++) {
    var u = D.unassigned[mv[i]];
    if (u) { list = list.concat(u.photos || []); }
  }
  return list;
}
function photosOf(ti, q) {
  var out = [], b = basePhotos(ti, q), rm = ST.t[ti].removed[q] || [], i;
  for (i = 0; i < b.length; i++) { if (rm.indexOf('b' + i) < 0) { out.push({ src: b[i], id: 'b' + i }); } }
  var a = ADDED[ti + '|' + q] || [];
  for (i = 0; i < a.length; i++) { out.push({ src: a[i], id: 'a' + i }); }
  return out;
}
function removePhoto(ti, q, id) {
  if (id.charAt(0) === 'b') {
    var rm = ST.t[ti].removed[q] || (ST.t[ti].removed[q] = []);
    rm.push(id); save();
  } else {
    var a = ADDED[ti + '|' + q] || [];
    a.splice(parseInt(id.substr(1), 10), 1);
    ADDED[ti + '|' + q] = a; saveAdded();
  }
}


/* ---------- linked duplicates (same observations in several checklists) ---------- */
var TWINS = {};
function twinKey(ti, q) {
  var it = D.templates[ti].items[q], o = [];
  if (!it || !it.notes) { return ''; }
  for (var i = 0; i < it.notes.length; i++) { o.push(it.notes[i].obs); }
  return o.sort(function (a, b) { return a - b; }).join(',');
}
function buildTwins() {
  TWINS = {}; var g = {};
  for (var ti = 0; ti < D.templates.length; ti++) {
    for (var q in D.templates[ti].items) { var k = twinKey(ti, q); if (k) { (g[k] || (g[k] = [])).push([ti, q]); } }
  }
  for (var k in g) {
    if (g[k].length < 2) { continue; }
    for (var a = 0; a < g[k].length; a++) {
      var l = [];
      for (var b = 0; b < g[k].length; b++) { if (b !== a) { l.push(g[k][b]); } }
      TWINS[g[k][a][0] + '|' + g[k][a][1]] = l;
    }
  }
}
function twinSet(ti, q, f, v) {
  var l = TWINS[ti + '|' + q] || [];
  for (var i = 0; i < l.length; i++) { ST.t[l[i][0]][f][l[i][1]] = v; }
}
function twinPhotos(ti, q) {
  var l = TWINS[ti + '|' + q] || [];
  for (var i = 0; i < l.length; i++) {
    ST.t[l[i][0]].removed[l[i][1]] = (ST.t[ti].removed[q] || []).slice(0);
    ADDED[l[i][0] + '|' + l[i][1]] = (ADDED[ti + '|' + q] || []).slice(0);
  }
}
function twinLabel(ti, q) {
  var l = TWINS[ti + '|' + q] || [], n = [];
  for (var i = 0; i < l.length; i++) { n.push(D.templates[l[i][0]].shortName + ' ' + l[i][1]); }
  return n.join(', ');
}

/* ---------- one finding per observation ---------- */
function findObs(ti, q) {
  var it = D.templates[ti].items[q], o = [], i;
  if (it && it.notes) { for (i = 0; i < it.notes.length; i++) { o.push(it.notes[i].obs); } }
  o.sort(function (a, b) { return a - b; });
  var mv = ST.moved[ti + '|' + q] || [];
  for (i = 0; i < mv.length; i++) { var u = D.unassigned[mv[i]]; if (u && o.indexOf(u.obs) < 0) { o.push(u.obs); } }
  return o;
}
function findKeys(ti, q) {
  var o = findObs(ti, q), k = [];

  return k;
}
function findLabel(ti, q) {

  return o.length > 1 ? '<div class="fl">Finding 1 - Obs ' + esc(o[0]) + '</div>' : '';
}
function extraHtml(ti, q) {

function twinSetX(ti, q, obs, f, v) {
  var l = TWINS[ti + '|' + q] || [];

function bindExtra(el, q) {
  var ts = ST.t[CUR], fx = el.querySelectorAll('.fx'), m = { 'x-cmt': 'cmt', 'x-subj': 'subj', 'x-act': 'act' };
  for (var i = 0; i < fx.length; i++) {

function tepaInitials(n) {
  var p = String(n == null ? '' : n).replace(/^\s+|\s+$/g, '').split(/\s+/), s = '', i;
  if (!p[0]) { return ''; }
  if (p.length > 1 && p[0].length > 1 && p[0] === p[0].toUpperCase() && p[p.length - 1] !== p[p.length - 1].toUpperCase()) { p.push(p.shift()); }
  for (i = 0; i < p.length; i++) {
    var c = p[i].charAt(0);
    try { c = c.normalize('NFD').charAt(0); } catch (e) {}
    if (/[A-Za-z]/.test(c)) { s += c.toUpperCase(); }
  }
  return s;
}
function tepaFileName(ymd, vessel, type, inspector) {
  var d = String(ymd || '').split('-'), parts = [];
  if (d.length === 3) { parts.push(d[0] + ' ' + d[1] + ' ' + d[2]); }
  if (vessel) { parts.push(String(vessel)); }
  if (type) { parts.push(String(type)); }
  var ini = tepaInitials(inspector);
  if (ini) { parts.push(ini); }
  return parts.join(' ').replace(/[\\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '') || 'Inspection';
}
function typeName(T) { return T.shortName || String(T.title || '').replace(' -- ', ' '); }
function combinedType() {
  var names = [], i, common = 0;
  for (i = 0; i < D.templates.length; i++) { if (/^OVID-COMMON-PART[1-4]-/.test(D.templates[i].form)) { common++; } }
  for (i = 0; i < D.templates.length; i++) {
    var T = D.templates[i];
    if (common === 4 && /^OVID-COMMON-PART[1-4]-/.test(T.form)) {
      if (names.indexOf('OVID Common') < 0) { names.push('OVID Common'); }
    } else { names.push(typeName(T)); }
  }
  return names.join(' + ');
}
function initials(n) {
  var p = trim(n).split(/\s+/), s = '';
  for (var i = 0; i < p.length; i++) { if (p[i]) { s += p[i].charAt(0).toUpperCase(); } }
  return s;
}
function shrink(src, max, q, cb) {
  var img = new Image();
  img.onload = function () {
    var r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    var c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    cb(c.toDataURL('image/jpeg', q));
  };
  img.onerror = function () { cb(src); };
  img.src = src;
}

    '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
    '<Override PartName="/xl/theme/theme1.xml" ContentType="application/vnd.openxmlformats-officedocument.theme+xml"/>' +
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>';
  var blob = buildZip([
    { name: '[Content_Types].xml', data: utf8Bytes(ct) },
    { name: '_rels/.rels', data: utf8Bytes(rels) },
    { name: 'xl/workbook.xml', data: utf8Bytes(wb) },
    { name: 'xl/_rels/workbook.xml.rels', data: utf8Bytes(wbRels) },
    { name: 'xl/styles.xml', data: b64Bytes(TPL_STYLES) },
    { name: 'xl/theme/theme1.xml', data: b64Bytes(TPL_THEME) },
    { name: 'xl/worksheets/sheet1.xml', data: utf8Bytes(sheet) }
  ]);
  blob = new Blob([blob], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  var fname = tepaFileName(M.date, M.vessel, combinedType(), M.inspector) + '.xlsx';
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = fname;
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 2000);
  toast(rows.length + ' finding(s) exported');
};

/* ---------- init ---------- */
$('selFilter').onchange = renderList;
window.addEventListener('afterprint', function () { renderHeader(); });
$('selTpl').onchange = function () { CUR = parseInt(this.value, 10); renderAll(); window.scrollTo(0, 0); };
$('btnReset').onclick = function () {
  if (!window.confirm('Discard all answers and edits in this browser and go back to the original draft?')) { return; }
  try { localStorage.removeItem(SKEY); } catch (e) {}
  ADDED = {}; saveAdded(); ST = freshState(); bindMeta(); renderAll();
};
function start(data) {
  D = data; SKEY = 'tepa-review:' + D.id; CUR = 0; ST = null; ADDED = {};
  loadState(); buildTwins();
  var sel = $('selTpl');
  sel.innerHTML = '';
  for (var i = 0; i < D.templates.length; i++) {
    var o = document.createElement('option'), cnt = 0;
    for (var q in D.templates[i].items) { cnt++; }
    o.value = i; o.textContent = D.templates[i].title + ' (' + cnt + ')';
    sel.appendChild(o);
  }
  sel.className = D.templates.length < 2 ? 'hidden' : '';
  $('selFilter').value = 'all';
  bindMeta();
  $('loader').className = 'hidden';
  $('app').className = '';
  $('btnReports').className = LOADER ? '' : 'hidden';
  loadAdded(function () { renderAll(); window.scrollTo(0, 0); });
}

/* ---------- loader mode (hosted page: reports stored on this device only) ---------- */
function repGetAll(cb) {
  dbOpen(function (db) {
    if (!db) { cb([]); return; }
    var out = [], st = db.transaction('reports', 'readonly').objectStore('reports');
    var cur = st.openCursor();
    cur.onsuccess = function (e) {
      var c = e.target.result;
      if (c) { out.push(c.value); c['continue'](); } else { cb(out); }
    };
    cur.onerror = function () { cb(out); };
  });
}
function repPut(rec, cb) {
  dbOpen(function (db) {
    if (!db) { cb(false); return; }
    var tx = db.transaction('reports', 'readwrite');
    tx.objectStore('reports').put(rec, rec.id);
    tx.oncomplete = function () { cb(true); };
    tx.onerror = function () { cb(false); };
    tx.onabort = function () { cb(false); };
  });
}
function repDel(id, cb) {
  dbOpen(function (db) {
    if (!db) { cb(); return; }
    var tx = db.transaction('reports', 'readwrite');
    tx.objectStore('reports')['delete'](id);
    tx.oncomplete = function () { cb(); };
    tx.onerror = function () { cb(); };
  });
}
function showLoader() {
  $('app').className = 'hidden';
  $('loader').className = '';
  repGetAll(function (list) {
    list.sort(function (a, b) { return a.loaded < b.loaded ? 1 : -1; });
    var box = $('repList'), h = '';
    for (var i = 0; i < list.length; i++) {
      var d = list[i].data, names = [];
      for (var t = 0; t < d.templates.length; t++) { names.push(d.templates[t].title); }
      h += '<div class="card"><div style="font-weight:bold">' + esc(d.meta.vessel) + ' - ' + esc(d.meta.date) + '</div>' +
        '<div style="font-size:12px;color:#777;margin:3px 0 8px">' + esc(names.join(' / ')) + '</div>' +
        '<button class="smallbtn" type="button" data-open="' + i + '">Open</button> ' +
        '<button class="smallbtn" type="button" data-del="' + i + '" style="border-color:#8a2b1f;color:#8a2b1f">Remove from this device</button></div>';
    }
    box.innerHTML = h || '<div class="card" style="color:#777">No report on this device.</div>';
    var b = box.querySelectorAll('button[data-open]');
    for (var k = 0; k < b.length; k++) {
      b[k].onclick = function () { start(list[parseInt(this.getAttribute('data-open'), 10)].data); };
    }
    var dl = box.querySelectorAll('button[data-del]');
    for (var m = 0; m < dl.length; m++) {
      dl[m].onclick = function () {
        var rec = list[parseInt(this.getAttribute('data-del'), 10)];
        if (!window.confirm('Remove report ' + rec.data.meta.vessel + ' and its answers from this device?')) { return; }
        try { localStorage.removeItem('tepa-review:' + rec.id); } catch (e) {}
        repDel(rec.id, function () {
          dbOpen(function (db) {
            if (db) { db.transaction('photos', 'readwrite').objectStore('photos')['delete']('tepa-review:' + rec.id); }
            showLoader();
          });
        });
      };
    }
  });
}
function extractData(text) {
  var m = /<script id="review-data" type="application\/json">([\s\S]*?)<\/script>/.exec(text);
  var raw = m ? m[1] : text;
  raw = raw.replace(/^\s+|\s+$/g, '');
  if (raw.charAt(0) !== '{') { return null; }
  try {
    var d = JSON.parse(raw);
    return d && d.id && d.templates && d.meta ? d : null;
  } catch (e) { return null; }
}
$('inReport').onchange = function () {
  var f = this.files && this.files[0];
  this.value = '';
  if (!f) { return; }
  var fr = new FileReader();
  fr.onload = function () {
    var d = extractData(String(fr.result));
    if (!d) { toast('Not a report file'); return; }
    repPut({ id: d.id, loaded: new Date().toISOString(), data: d }, function (ok) {
      if (!ok) { toast('Not enough storage on this device'); return; }
      start(d);
    });
  };
  fr.onerror = function () { toast('File could not be read'); };
  fr.readAsText(f);
};
$('btnReports').onclick = function () { showLoader(); };

(function init() {
  var embedded = extractData(document.getElementById('review-data').textContent);
  if (embedded) { start(embedded); return; }
  LOADER = true;
  showLoader();
})();
</script>
